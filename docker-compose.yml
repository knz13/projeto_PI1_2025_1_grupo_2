services:
  backend:
    build: ./backend
    container_name: backend-app
    restart: unless-stopped
    ports:
      - "5875:5875"  # Expor a porta do backend para acesso direto
    environment:
      - NODE_ENV=production
      - PORT=5875
    env_file:
      - ./backend/.env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP na porta 8080 em vez de 80 para evitar conflitos
      - "4665:4665"   # HTTPS na porta 4665
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:rw
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
