version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projeto-backend
    # No external ports - only accessible through nginx
    environment:
      - NODE_ENV=production
      - PORT=5712
      - PYTHONUNBUFFERED=1  # Ensure Python output is not buffered
      - PYTHONIOENCODING=utf-8  # Set proper encoding for Python output
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1  # Allow git to work across filesystem boundaries
    env_file:
      - backend/.env
    volumes:
      # Mount the entire repository for git operations (includes .git automatically)
      - .:/app:rw  # Make the mount read-write
      # Override dist with Docker volume to maintain permissions
      - dist_data:/app/backend/dist
      # Use Docker volume for logs to maintain proper permissions
      - logs_data:/app/backend/logs
      # Python local packages directory
      - python_local:/app/.local
      # Mount node_modules as volume to avoid permission issues and improve performance
      - node_modules_data:/app/backend/node_modules
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5712/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - projeto-network

  nginx:
    image: nginx:alpine
    container_name: projeto-nginx
    ports:
      - "5712:5712"    # External access through nginx (HTTP and HTTPS)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - projeto-network
    command: >
      sh -c "
        echo 'Checking SSL certificate files...' &&
        ls -la /etc/letsencrypt/live/no-fluxo-api.shop/ &&
        ls -la /etc/letsencrypt/live/no-fluxo-api.shop/fullchain.pem || echo 'Certificate file not found!' &&
        ls -la /etc/letsencrypt/live/no-fluxo-api.shop/privkey.pem || echo 'Private key file not found!' &&
        if [ -f /etc/letsencrypt/live/no-fluxo-api.shop/fullchain.pem ] && [ -f /etc/letsencrypt/live/no-fluxo-api.shop/privkey.pem ]; then
          echo 'SSL certificates found, starting nginx...' &&
          nginx -g 'daemon off;'
        else
          echo 'SSL certificates not found, please check certificate paths' &&
          exit 1
        fi
      "

networks:
  projeto-network:
    driver: bridge

volumes:
  logs_data:
    driver: local
  dist_data:
    driver: local
  python_local:
    driver: local
  node_modules_data:
    driver: local 